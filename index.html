<title>CURSED PANELS — Boss Rush</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Noto+Sans+JP:wght@900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#080a13;--panel:rgba(11,13,27,.96);--line:#343957;--white:#f4f5ff;--muted:#a5accb;--violet:#9b6bff;--cyan:#54d9ff}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#05060c;color:var(--white);font-family:Inter,system-ui,Segoe UI,sans-serif;overflow:hidden;user-select:none}
#wrap{position:relative;width:min(100vw,calc(100vh*1.6));aspect-ratio:1.6;margin:auto;top:50%;transform:translateY(-50%);background:#080a13;overflow:hidden;box-shadow:0 0 50px #5d36ca25}

@media(prefers-reduced-motion:reduce){button{transition:none}}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;pointer-events:none;z-index:4}
.card{pointer-events:auto;background:linear-gradient(145deg,rgba(14,17,34,.97),rgba(7,8,18,.98));color:var(--white);border:1px solid #7773ca;border-radius:16px;box-shadow:0 18px 70px #000b,0 0 35px #7854df25,inset 0 1px #ffffff12;padding:clamp(14px,2vw,24px);width:max-content;max-width:96%;max-height:96%;overflow-y:auto;text-align:center;letter-spacing:.2px;backdrop-filter:blur(10px)}
h1{font-family:Bangers,Impact,sans-serif;font-size:clamp(42px,7vw,78px);margin:0 0 10px;line-height:.9;letter-spacing:2px;color:#f8f7ff;text-shadow:0 4px #6b43bf,0 0 28px #8a57ff55}h2{font-family:Bangers,Impact,sans-serif;font-size:clamp(27px,3.6vw,39px);margin:0 0 8px;letter-spacing:1px}p{margin:8px 0;color:var(--muted);font:500 13px/1.45 system-ui;letter-spacing:0}.eyebrow{font:800 10px/1.4 system-ui;text-transform:uppercase;color:var(--cyan);letter-spacing:2.2px;margin-bottom:8px}
button,input,select{font:600 14px/1.2 system-ui;border:1px solid #454b70;border-radius:8px;padding:10px 13px;margin:4px;background:#12172b;color:var(--white);outline:none}button{background:linear-gradient(135deg,#6844c7,#382569);border-color:#9876ef;cursor:pointer;transition:transform .14s,border-color .14s,filter .14s}button:hover{filter:brightness(1.22);transform:translateY(-1px);border-color:#c5b6ff}button:active{transform:translateY(0)}input:focus,select:focus{border-color:var(--cyan)}input[type=text],input:not([type]),input[readonly]{min-width:0;max-width:100%}

/* Arcade re-theme inspired by the supplied reference: deep purple, gold trim, and rosy cabinet glow. */
:root{color-scheme:dark;--ink:#0e0820;--panel:rgba(25,13,43,.98);--line:#7c456b;--white:#fff4df;--muted:#d1c0dc;--violet:#a76bff;--cyan:#8eeaff;--arcade-gold:#f0b94a;--arcade-pink:#d6336c}
html,body{background:#0e0820;color:#fff4df}
#wrap{background:#0e0820;border:1px solid #d6336c66;border-radius:11px;box-shadow:0 0 0 3px #1a0d2b,0 0 28px #d6336c55,0 0 72px #6d39b927;isolation:isolate}
#wrap:after{content:"";position:absolute;inset:4px;border:1px solid #f0b94a38;border-radius:7px;pointer-events:none;z-index:3;opacity:.8}
canvas{border-radius:9px;filter:saturate(1.12) contrast(1.04);}
.card{background:linear-gradient(145deg,rgba(37,20,59,.985),rgba(17,8,34,.99));border:2px solid #a34f7c;border-radius:9px;box-shadow:0 0 0 3px #1a0c2c,0 12px 42px #000b,0 0 28px #d6336c35,inset 0 1px #ffe5ad20;padding:clamp(14px,2vw,24px);backdrop-filter:blur(6px)}
h1{font-family:Bangers,Impact,sans-serif;color:#ffe5a0;text-shadow:0 3px #77294c,0 0 10px #d6336c70,0 0 28px #f0b94a2f;letter-spacing:2.4px}
h2{font-family:Bangers,Impact,sans-serif;color:#f0b94a;text-shadow:0 0 14px #d6336c3b;letter-spacing:1.2px}
p{color:#d5c3e2}
.eyebrow{color:#ff87b8;letter-spacing:2.3px;text-shadow:0 0 12px #d6336c55}
button,input,select{font:700 13px/1.2 system-ui;border:1px solid #80506f;border-radius:6px;padding:10px 13px;margin:4px;background:#180d2d;color:#fff2d1;outline:none;box-shadow:inset 0 1px #ffffff0a}
button{background:linear-gradient(145deg,#f0b94a 0%,#ed8a52 52%,#d6336c 100%);border:1px solid #ffe19a;color:#230d29;text-transform:uppercase;letter-spacing:.45px;font-weight:900;box-shadow:0 3px 0 #77274d,0 0 14px #d6336c2a;transition:transform .14s,border-color .14s,filter .14s,box-shadow .14s}
button:hover{filter:brightness(1.16);transform:translateY(-1px);border-color:#fff0b8;box-shadow:0 4px 0 #77274d,0 0 22px #ed8a5260}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #77274d}
input:focus,select:focus{border-color:#f0b94a;box-shadow:0 0 0 2px #f0b94a25}
input::placeholder{color:#a991bd}
.ch{border:1px solid #583557;border-radius:6px;background:linear-gradient(145deg,#241339,#130b25);box-shadow:inset 0 1px #ffffff08;transition:transform .14s,border-color .14s,background .14s;color:#fff4df}
.ch:hover{transform:translateY(-2px);border-color:#e37ca4;box-shadow:0 0 15px #d6336c2a}
.ch.on{background:linear-gradient(145deg,#382147,#1d1231);border-color:#f0b94a;box-shadow:0 0 0 1px #f0b94a4b,0 0 20px #f0b94a25,inset 0 0 18px #d6336c15}
.ch b{font-family:Bangers,Impact,sans-serif;letter-spacing:.7px;text-shadow:0 0 10px #d6336c26}
.ch small{color:#d5c3e2}
.row{border-bottom:1px solid #55304f;color:#fff0dc}
.settings-card{border-color:#b95a80}
.setting-row{border:1px solid #4d2b51;border-radius:6px;background:#170c2a}
.setting-row b{color:#ffe6aa}
.setting-row small,.helper{color:#c2afcf}
.setting-row input[type=checkbox]{accent-color:#f0b94a}
.setting-row input[type=range]{accent-color:#f0b94a}
.err{color:#ff8ca6}
@media(max-width:640px){#wrap{border-radius:0}#wrap:after{inset:3px;border-radius:0}}
